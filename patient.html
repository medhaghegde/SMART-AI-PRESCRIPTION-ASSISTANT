<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>My Medicines | Voice-First Prescription Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f12;
            --bg-secondary: #1a1a1f;
            --bg-card: #22222a;
            --bg-elevated: #2a2a33;
            --text-primary: #f0f0f4;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7a;
            --accent: #7c3aed;
            --accent-light: #8b5cf6;
            --accent-glow: rgba(124, 58, 237, 0.25);
            --accent-pale: #2d1b4e;
            --success: #10b981;
            --warning: #f59e0b;
            --morning: #fbbf24;
            --afternoon: #60a5fa;
            --night: #a78bfa;
            --border: #2a2a33;
            --border-light: #33333d;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.4);
            --radius: 20px;
            --radius-sm: 14px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            background: radial-gradient(ellipse at 80% 20%, rgba(124, 58, 237, 0.08), transparent),
                        linear-gradient(135deg, var(--bg-secondary) 0%, #0e0e12 100%);
            padding: 32px 28px 68px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .hero-glow {
            position: absolute;
            width: 280px;
            height: 280px;
            background: var(--accent-glow);
            filter: blur(70px);
            top: -60px;
            right: -40px;
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 2;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            background: linear-gradient(145deg, var(--accent), #a855f7);
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .brand-icon i {
            font-size: 20px;
            color: white;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 18px;
            background: linear-gradient(120deg, #fff, #c0b7ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .lang-badge {
            background: rgba(34, 34, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-light);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid transparent;
            transition: all 0.25s ease;
        }

        .nav-link:hover {
            color: var(--text-primary);
            background: rgba(124, 58, 237, 0.16);
            border-color: var(--border-light);
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .avatar {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 12px 25px var(--accent-glow);
            transition: transform 0.25s ease;
        }

        .avatar i {
            font-size: 32px;
            color: white;
        }

        .greeting {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.4px;
            font-weight: 500;
        }

        .patient-name {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #c8c5ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 6px 0 8px;
        }

        .hero-sub {
            font-size: 14px;
            color: var(--text-muted);
        }

        .med-count-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            padding: 8px 20px;
            border-radius: 60px;
            margin-top: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--border-light);
        }

        /* slots */
        .shell {
            max-width: 1040px;
            margin: -42px auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 3;
        }

        .slot-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 36px;
        }

        @media (max-width: 560px) {
            .slot-row {
                grid-template-columns: 1fr;
            }
        }

        .slot {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            opacity: 0.6;
        }

        .slot.active {
            opacity: 1;
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--bg-card), var(--accent-pale));
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .slot:hover {
            opacity: 1;
            transform: translateY(-3px);
            border-color: var(--accent-light);
        }

        .slot-icon {
            width: 48px;
            height: 48px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .morning .slot-icon {
            background: rgba(251, 191, 36, 0.12);
        }
        .afternoon .slot-icon {
            background: rgba(96, 165, 250, 0.12);
        }
        .night .slot-icon {
            background: rgba(167, 139, 250, 0.12);
        }
        .morning .slot-icon i { color: var(--morning); }
        .afternoon .slot-icon i { color: var(--afternoon); }
        .night .slot-icon i { color: var(--night); }

        .slot-info h4 {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .slot-number {
            font-size: 26px;
            font-weight: 800;
        }

        /* medicine grid */
        .med-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .med-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .med-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
        }

        .med-card:active {
            transform: scale(0.98);
        }

        .med-img {
            height: 160px;
            background: linear-gradient(145deg, var(--bg-elevated), #1e1e26);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .med-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .med-card:hover .med-img img {
            transform: scale(1.04);
        }

        .med-img .placeholder-pill {
            font-size: 54px;
            color: var(--accent-light);
            opacity: 0.45;
        }

        .med-info {
            padding: 20px;
        }

        .med-name {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .med-instruction-preview {
            font-size: 12px;
            background: var(--bg-elevated);
            padding: 8px 12px;
            border-radius: 12px;
            color: var(--text-secondary);
            line-height: 1.45;
            margin-bottom: 14px;
        }

        .med-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .pattern-badge {
            background: var(--accent-pale);
            padding: 4px 12px;
            border-radius: 25px;
            color: var(--accent-light);
            font-weight: 700;
        }

        .audio-prompt {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
        }

        /* Modal Styles - clean popup that opens on click */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.94);
            backdrop-filter: blur(18px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .overlay.open {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .modal-card {
            background: var(--bg-card);
            border-radius: 40px;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(124, 58, 237, 0.4);
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.35s cubic-bezier(0.21, 1.11, 0.4, 1);
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-image {
            height: 200px;
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-image .no-img-icon {
            font-size: 70px;
            color: var(--accent-light);
            opacity: 0.5;
        }

        /* Visual wave animation when audio plays */
        .sound-wave {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 40px;
            pointer-events: none;
        }
        .sound-wave span {
            width: 3px;
            height: 12px;
            background: var(--accent-light);
            border-radius: 3px;
            animation: wave 0.8s infinite ease alternate;
        }
        .sound-wave span:nth-child(2) { animation-delay: 0.2s; height: 16px; }
        .sound-wave span:nth-child(3) { animation-delay: 0.4s; height: 10px; }
        @keyframes wave {
            0% { height: 6px; opacity: 0.4; }
            100% { height: 20px; opacity: 1; }
        }

        .modal-content {
            padding: 28px 28px 32px;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #cdc6ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .dose-tag {
            display: inline-block;
            background: var(--accent-pale);
            color: var(--accent-light);
            font-size: 12px;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 50px;
            margin: 8px 0 16px;
        }

        .instruction-box {
            background: var(--bg-elevated);
            border-radius: 24px;
            padding: 20px;
            font-size: 16px;
            line-height: 1.6;
            border-left: 3px solid var(--accent);
            margin: 16px 0 20px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .timing-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .chip {
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        .chip-morning {
            background: rgba(251, 191, 36, 0.18);
            color: #fcd34d;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .chip-afternoon {
            background: rgba(96, 165, 250, 0.18);
            color: #7ab3ff;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        .chip-night {
            background: rgba(167, 139, 250, 0.18);
            color: #c4b5fd;
            border: 1px solid rgba(167, 139, 250, 0.3);
        }

        .auto-play-badge {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            padding: 8px;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 50px;
            display: inline-block;
            width: auto;
            animation: subtlePulse 1.8s infinite;
        }

        @keyframes subtlePulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; background: rgba(124, 58, 237, 0.2);}
        }

        .close-modal {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            width: 38px;
            height: 38px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            color: white;
            transition: 0.2s;
            z-index: 10;
        }

        .close-modal:hover {
            background: var(--accent);
            transform: rotate(90deg);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-state {
            text-align: center;
            padding: 60px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state {
            grid-column: span 3;
            text-align: center;
            padding: 60px;
            background: var(--bg-card);
            border-radius: var(--radius);
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1100;
            animation: fadeUp 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px);}
            to { opacity: 1; transform: translateX(-50%) translateY(0);}
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="hero-glow"></div>
    <div class="hero-top">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-robot"></i></div>
            <span class="brand-name">MediVoice AI</span>
        </div>
        <div class="nav-actions">
            <a href="/" class="nav-link">Home</a>
            <a href="/staff" class="nav-link">Staff Portal</a>
            <span class="lang-badge" id="langPill"><i class="fas fa-globe"></i> —</span>
        </div>
    </div>
    <div class="hero-content">
        <div class="avatar"><i class="fas fa-user-nurse"></i></div>
        <div class="greeting">Welcome back,</div>
        <div class="patient-name" id="patientName">—</div>
        <div class="hero-sub" id="welcomeMsg">Tap any medicine → voice plays automatically</div>
        <div class="med-count-badge" id="medicineCountBadge"><i class="fas fa-pills"></i> —</div>
    </div>
</div>

<div class="shell">
    <div class="slot-row" id="slotContainer">
        <div class="slot morning active" data-time="morning">
            <div class="slot-icon"><i class="fas fa-sun"></i></div>
            <div class="slot-info">
                <h4>MORNING</h4>
                <div class="slot-number" id="morningCount">0</div>
            </div>
        </div>
        <div class="slot afternoon" data-time="afternoon">
            <div class="slot-icon"><i class="fas fa-cloud-sun"></i></div>
            <div class="slot-info">
                <h4>AFTERNOON</h4>
                <div class="slot-number" id="afternoonCount">0</div>
            </div>
        </div>
        <div class="slot night" data-time="night">
            <div class="slot-icon"><i class="fas fa-moon"></i></div>
            <div class="slot-info">
                <h4>NIGHT</h4>
                <div class="slot-number" id="nightCount">0</div>
            </div>
        </div>
    </div>

    <div id="loadingWrapper" class="loading-state" style="display: flex;">
        <div class="spinner"></div>
        <p>Loading your prescription plan...</p>
    </div>
    <div class="med-grid" id="medGrid" style="display: none;"></div>
</div>

<div class="overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
        <div class="modal-image" id="modalImageArea">
            <button class="close-modal" id="modalCloseBtn"><i class="fas fa-times"></i></button>
            <i class="fas fa-tablets no-img-icon" id="placeholderIcon"></i>
            <img id="modalImage" src="" alt="" style="display: none;">
            <div class="sound-wave" id="soundWaveAnim" style="display: none;">
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
        <div class="modal-content">
            <div class="modal-title" id="modalMedName">Medicine</div>
            <span class="dose-tag" id="modalPattern">Dosage</span>
            <div class="instruction-box" id="modalInstruction">
                Loading instructions...
            </div>
            <div class="timing-chips" id="modalTimings"></div>
            <div class="auto-play-badge" id="autoPlayNotice">
                <i class="fas fa-head-side-headphones"></i> 🔊 Auto-playing instructions
            </div>
        </div>
    </div>
</div>

<script>
    let allMedicines = [];
    let currentLanguage = 'english';
    let currentAudio = null;
    let currentSelectedMedicine = null;
    let activeTimeFilter = 'morning';

    const patientId = window.location.pathname.split('/').pop();

    async function fetchMedicines() {
        try {
            const res = await fetch(`/api/get_patient_medicines/${patientId}`);
            const data = await res.json();
            document.getElementById('loadingWrapper').style.display = 'none';
            document.getElementById('medGrid').style.display = 'grid';
            if (data.success) {
                allMedicines = data.medicines;
                currentLanguage = data.local_language || 'english';
                document.getElementById('patientName').innerText = data.patient_name || 'Valued Patient';
                document.getElementById('langPill').innerHTML = `<i class="fas fa-language"></i> ${currentLanguage.toUpperCase()}`;
                document.getElementById('medicineCountBadge').innerHTML = `<i class="fas fa-pills"></i> ${allMedicines.length} Medicine${allMedicines.length !== 1 ? 's' : ''}`;
                
                const greetingTexts = {
                    english: 'Tap any medicine card → voice plays instantly',
                    hindi: 'दवा पर टैप करें → आवाज़ में निर्देश सुनें',
                    kannada: 'ಔಷಧಿ ಕಾರ್ಡ್ ಟ್ಯಾಪ್ ಮಾಡಿ → ಧ್ವನಿ ಸೂಚನೆ',
                    telugu: 'మందుపై నొక్కండి → వాయిస్ ఇన్స్ట్రక్షన్',
                    tamil: 'மருந்தைத் தட்டவும் → குரல் வழிகாட்டுதல்'
                };
                document.getElementById('welcomeMsg').innerText = greetingTexts[currentLanguage.toLowerCase()] || greetingTexts.english;
                updateSlotCounters();
                filterAndRender(activeTimeFilter);
            } else {
                throw new Error(data.message || 'Failed to load');
            }
        } catch (err) {
            document.getElementById('loadingWrapper').innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle" style="font-size:40px; margin-bottom:16px; color:var(--accent);"></i><h3>⚠️ Connection Error</h3><p>${err.message}</p></div>`;
        }
    }

    function getTimingArray(timingPattern) {
        if (!timingPattern) return [0,0,0];
        const parts = timingPattern.split('-');
        return [parseInt(parts[0]) || 0, parseInt(parts[1]) || 0, parseInt(parts[2]) || 0];
    }

    function medicinesByTimeSlot(time) {
        return allMedicines.filter(med => {
            const [m, a, n] = getTimingArray(med.timing_pattern);
            if (time === 'morning') return m > 0;
            if (time === 'afternoon') return a > 0;
            if (time === 'night') return n > 0;
            return false;
        });
    }

    function updateSlotCounters() {
        document.getElementById('morningCount').innerText = medicinesByTimeSlot('morning').length;
        document.getElementById('afternoonCount').innerText = medicinesByTimeSlot('afternoon').length;
        document.getElementById('nightCount').innerText = medicinesByTimeSlot('night').length;
    }

    function filterAndRender(time) {
        activeTimeFilter = time;
        document.querySelectorAll('.slot').forEach(slot => slot.classList.remove('active'));
        const activeSlot = document.querySelector(`.slot[data-time="${time}"]`);
        if(activeSlot) activeSlot.classList.add('active');
        const filteredList = medicinesByTimeSlot(time);
        renderMedicineGrid(filteredList.length ? filteredList : []);
    }

    function renderMedicineGrid(medicinesArray) {
        const grid = document.getElementById('medGrid');
        grid.innerHTML = '';
        if (!medicinesArray.length) {
            grid.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-day" style="font-size:48px; opacity:0.6;"></i><h3 style="margin-top:12px;">No medicines for this slot</h3><p>Tap another time or contact your doctor.</p></div>`;
            return;
        }
        medicinesArray.forEach((med, idx) => {
            const hasImage = med.medicine_image && med.medicine_image !== '';
            let imgSrc = '';
            if (hasImage) {
                imgSrc = med.medicine_image.startsWith('http') ? med.medicine_image : (med.medicine_image.startsWith('/uploads/') ? med.medicine_image : `/uploads/medicines/${med.medicine_image.split('/').pop()}`);
            }
            const shortInstruction = med.translated_instruction || med.instruction || 'Take as directed by physician';
            const card = document.createElement('div');
            card.className = 'med-card';
            card.style.animationDelay = `${idx * 0.04}s`;
            card.innerHTML = `
                <div class="med-img">
                    ${hasImage ? `<img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(med.name)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''}
                    <i class="fas fa-pills placeholder-pill" ${hasImage ? 'style="display:none"' : ''}></i>
                </div>
                <div class="med-info">
                    <div class="med-name">${escapeHtml(med.name)}</div>
                    <div class="med-instruction-preview">${escapeHtml(shortInstruction.length > 70 ? shortInstruction.substring(0, 67) + '...' : shortInstruction)}</div>
                    <div class="med-meta">
                        <span class="pattern-badge">${escapeHtml(med.timing_pattern || 'As needed')}</span>
                        <span class="audio-prompt"><i class="fas fa-play-circle"></i> Auto-voice</span>
                    </div>
                </div>
            `;
            // ONE CLICK: open modal + play audio automatically
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                openModalAndPlayAudio(med);
            });
            grid.appendChild(card);
        });
    }

    // This function handles both: showing popup AND immediately playing the instruction voice
    function openModalAndPlayAudio(medicine) {
        // Stop any currently playing audio
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
        currentSelectedMedicine = medicine;
        
        // Fill modal with medicine details
        const modalName = document.getElementById('modalMedName');
        const modalPattern = document.getElementById('modalPattern');
        const modalInstruction = document.getElementById('modalInstruction');
        const modalTimingsDiv = document.getElementById('modalTimings');
        const modalImg = document.getElementById('modalImage');
        const placeholderIcon = document.getElementById('placeholderIcon');
        const soundWave = document.getElementById('soundWaveAnim');
        
        modalName.innerText = medicine.name || 'Medicine';
        modalPattern.innerText = `💊 ${medicine.timing_pattern || 'Standard dose'}`;
        modalInstruction.innerText = medicine.translated_instruction || medicine.instruction || 'Take exactly as prescribed by your doctor. Follow medical advice.';
        
        const timingArr = getTimingArray(medicine.timing_pattern);
        modalTimingsDiv.innerHTML = '';
        const labels = [
            { name: '🌅 Morning', active: timingArr[0] > 0, cls: 'chip-morning' },
            { name: '🌤️ Afternoon', active: timingArr[1] > 0, cls: 'chip-afternoon' },
            { name: '🌙 Night', active: timingArr[2] > 0, cls: 'chip-night' }
        ];
        labels.forEach(l => {
            if (l.active) {
                const chipSpan = document.createElement('span');
                chipSpan.className = `chip ${l.cls}`;
                chipSpan.innerText = l.name;
                modalTimingsDiv.appendChild(chipSpan);
            }
        });
        
        // Handle image
        if (medicine.medicine_image && medicine.medicine_image !== '') {
            let url = medicine.medicine_image;
            if (!url.startsWith('http') && !url.startsWith('/uploads/')) url = `/uploads/medicines/${url.split('/').pop()}`;
            modalImg.src = url;
            modalImg.style.display = 'block';
            placeholderIcon.style.display = 'none';
            modalImg.onerror = () => { modalImg.style.display = 'none'; placeholderIcon.style.display = 'block'; };
        } else {
            modalImg.style.display = 'none';
            placeholderIcon.style.display = 'block';
        }
        
        // Show modal popup
        document.getElementById('modalOverlay').classList.add('open');
        
        // --- AUTO PLAY AUDIO after modal opens (immediately) ---
        const audioUrl = medicine.audio_url;
        if (audioUrl) {
            // Show wave animation
            if(soundWave) soundWave.style.display = 'flex';
            try {
                currentAudio = new Audio(audioUrl);
                currentAudio.play().catch(err => {
                    console.warn("Audio play failed:", err);
                    const notice = document.getElementById('autoPlayNotice');
                    if(notice) notice.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Unable to play audio, but instructions shown above.';
                    if(soundWave) soundWave.style.display = 'none';
                });
                currentAudio.onended = () => {
                    if(soundWave) soundWave.style.display = 'none';
                    const notice = document.getElementById('autoPlayNotice');
                    if(notice) notice.innerHTML = '<i class="fas fa-check-circle"></i> ✓ Voice instruction finished';
                    setTimeout(() => {
                        if(notice && notice.innerHTML.includes('✓')) notice.innerHTML = '<i class="fas fa-head-side-headphones"></i> 🔊 Auto-playing instructions';
                    }, 2000);
                    currentAudio = null;
                };
                currentAudio.onerror = () => {
                    if(soundWave) soundWave.style.display = 'none';
                    const notice = document.getElementById('autoPlayNotice');
                    if(notice) notice.innerHTML = '<i class="fas fa-microphone-slash"></i> Audio error, read instructions above.';
                    currentAudio = null;
                };
            } catch(e) {
                if(soundWave) soundWave.style.display = 'none';
            }
        } else {
            // No audio URL, just show message
            const notice = document.getElementById('autoPlayNotice');
            if(notice) notice.innerHTML = '<i class="fas fa-info-circle"></i> No voice recording, please read instructions.';
            if(soundWave) soundWave.style.display = 'none';
        }
    }
    
    function closeModalHandler(event) {
        const overlay = document.getElementById('modalOverlay');
        if (event.target === overlay || event.target.id === 'modalCloseBtn' || event.target.closest('#modalCloseBtn')) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            overlay.classList.remove('open');
            currentSelectedMedicine = null;
            // reset wave
            const soundWave = document.getElementById('soundWaveAnim');
            if(soundWave) soundWave.style.display = 'none';
            const notice = document.getElementById('autoPlayNotice');
            if(notice) notice.innerHTML = '<i class="fas fa-head-side-headphones"></i> 🔊 Auto-playing instructions';
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // Slot filters
    document.querySelectorAll('.slot').forEach(slot => {
        slot.addEventListener('click', (e) => {
            const time = slot.getAttribute('data-time');
            if (time) filterAndRender(time);
        });
    });
    
    // Modal close events
    document.getElementById('modalOverlay').addEventListener('click', closeModalHandler);
    document.getElementById('modalCloseBtn').addEventListener('click', closeModalHandler);
    
    fetchMedicines();
</script>
</body>
